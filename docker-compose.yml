# The whole test environment, in one file.
#
#   test runner  ->  Selenium Grid  ->  Chrome / Firefox / Edge
#                                            |
#                                            v
#                                    Caddy (HTTPS, artra.test)
#                                            |
#                                            v
#                                    Artra (SolidStart)
#                                            |
#                          +-----------------+-----------------+
#                          v                 v                 v
#                     PostgreSQL           Redis            Mailpit
#
# Everything talks over one bridge network by service name, which is why the
# browsers can resolve https://artra.test and why the same commands work
# unchanged on a laptop and on a CI runner.
#
#   ./run.sh                       full stack, chrome, run the suite
#   ./run.sh browsers=chrome,firefox,edge
#   ./dev.sh browsers=chrome headed=chrome     watch it at http://localhost:7900
#
# The generated env files the services read are written by those scripts; see
# lib/stack-env.sh.

name: artra-e2e

services:

  # ---------------------------------------------------------------- data --

  postgres:
    image: postgres:18-alpine
    container_name: artra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run ./scripts/prepare-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-artra}
    volumes:
      # Postgres runs everything in here once, in name order, the first time the
      # data directory is empty: schema, then the fixture catalogue.
      - ./stack/db/init:/docker-entrypoint-initdb.d:ro
      # /var/lib/postgresql, not .../data. From 18 the official image stores the
      # cluster in a major-version subdirectory so pg_upgrade can work across a
      # mount boundary, and it refuses to start if it finds a volume mounted at
      # the old path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 matters. While it runs the init scripts, the official image
      # starts a temporary server bound to the unix socket only - so a bare
      # pg_isready reports ready before the schema and fixtures exist, and the
      # app and the seed job both start against an empty database. Going over
      # TCP means this only passes once initialisation has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-artra} -d ${POSTGRES_DB:-artra}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [artra-net]

  redis:
    image: redis:8-alpine
    container_name: artra-redis
    # No password: this instance holds nothing but throwaway sessions and
    # pending verifications, is not published to the host, and is reachable only
    # from inside this network.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [artra-net]

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: artra-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    ports:
      # The web UI, so a failing email test can be inspected by eye at
      # http://localhost:8025. The suite uses the same port's REST API.
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [artra-net]

  # --------------------------------------------------- application under test --

  artra:
    build:
      # Staged by scripts/prepare-app.sh from a local checkout or a fresh clone.
      context: ./.artra-build
      dockerfile: Dockerfile
      target: runtime
      args:
        # Inlined into the client bundle at build time - see the Dockerfile.
        VITE_URL: ${APP_URL:-https://artra.test}
        VITE_WS_URL: ${APP_WS_URL:-wss://artra.test/ws}
        VITE_EMAIL: ${EMAIL_REPLY_TO:-support@artra.test}
    image: artra-e2e/app:local
    container_name: artra-app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-artra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artra}
      REDIS_URL: redis://redis:6379
      VITE_URL: ${APP_URL:-https://artra.test}
      # Mail goes to the disposable server, never to a real provider. This is
      # the one switch that separates the test environment from production.
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-Artra <no-reply@artra.test>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@artra.test}
      # Application secrets. Generated per machine by scripts/prepare-env.sh and
      # never committed; they key hashes and HMACs, nothing external.
      ARGON_SECRET: ${ARGON_SECRET:?run ./scripts/prepare-env.sh}
      CODE_PEPPER: ${CODE_PEPPER:?run ./scripts/prepare-env.sh}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:?run ./scripts/prepare-env.sh}
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:?run ./scripts/prepare-env.sh}
      IP_SECRET: ${IP_SECRET:?run ./scripts/prepare-env.sh}
      # Artra fetches its own API over the public URL while server-rendering the
      # catalogue. Without this, that fetch fails TLS validation, the catalogue
      # renders its empty state, and the page looks like a database problem.
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - ./stack/caddy/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    # The app resolves its own public hostname back to Caddy - which is what its
    # server-side fetch needs - through the network alias declared on the caddy
    # service below.
    networks: [artra-net]

  # One-shot: gives the seeded accounts a password, using the application's own
  # Argon2 parameters. Runs on every `up` and is idempotent, so rotating
  # SEED_USER_PASSWORD needs no database rebuild.
  seed:
    build:
      context: ./.artra-build
      dockerfile: Dockerfile
      target: seed
    image: artra-e2e/seed:local
    container_name: artra-seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-artra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artra}
      ARGON_SECRET: ${ARGON_SECRET}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?run ./scripts/prepare-env.sh}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3
    networks: [artra-net]

  caddy:
    image: caddy:2-alpine
    container_name: artra-caddy
    volumes:
      - ./stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued by scripts/prepare-certs.sh. Gitignored - the key is generated
      # per machine and protects a hostname that only resolves inside this
      # network.
      - ./stack/caddy/certs:/certs:ro
      - caddy-data:/data
    ports:
      # Published so the site can be opened from the host during a demo -
      # https://localhost:8443 with the certificate warning accepted.
      - "8443:443"
    depends_on:
      artra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://artra.test/"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      artra-net:
        # The name the browsers resolve, and the host in every cookie, link and
        # Origin check. It has to match APP_URL exactly.
        aliases: [artra.test]

  # ------------------------------------------------------------ selenium grid --

  selenium-hub:
    image: selenium/hub:4.43.0-20260404
    container_name: artra-selenium-hub
    environment:
      # A node whose browsers are all busy should queue, not fail the session.
      SE_SESSION_REQUEST_TIMEOUT: 300
      SE_SESSION_RETRY_INTERVAL: 2
    ports:
      # The Grid console: sessions, queue depth and which node holds what.
      - "4444:4444"
    healthcheck:
      # check-grid.sh reports healthy only once the grid is READY, which means
      # at least one node has registered. That is the condition the test runner
      # actually needs - a hub with no nodes accepts a session request and then
      # times it out - so it is worth waiting for rather than merely checking
      # that the router answers.
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "localhost", "--port", "4444"]
      interval: 5s
      timeout: 10s
      # Long enough to cover a first run that is still pulling a browser image.
      retries: 60
    networks: [artra-net]

  chrome:
    image: selenium/node-chrome:147.0-chromedriver-147.0-grid-4.43.0-20260404
    shm_size: 2gb   # Chrome crashes rather than degrades on a small /dev/shm
    environment: &node-env
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: ${PARALLELISM:-2}
      SE_NODE_OVERRIDE_MAX_SESSIONS: true
      SE_NODE_SESSION_TIMEOUT: 300
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080
    depends_on:
      selenium-hub:
        # service_started, NOT service_healthy. The hub reports healthy only
        # once a node has registered with it, so waiting for health here would
        # deadlock: the node waits for the hub, the hub waits for the node.
        condition: service_started
    ports:
      # noVNC: open http://localhost:7900 (password "secret") to watch a headed
      # session live. Headless sessions show an empty desktop, which is why
      # dev.sh takes a headed= list.
      - "7900:7900"
    networks: [artra-net]

  firefox:
    image: selenium/node-firefox:129.0-geckodriver-0.36-grid-4.43.0-20260404
    shm_size: 2gb
    environment: *node-env
    depends_on:
      selenium-hub:
        condition: service_started
    ports:
      - "7901:7900"
    networks: [artra-net]

  edge:
    image: selenium/node-edge:146.0-edgedriver-146.0-grid-4.43.0-20260404
    shm_size: 2gb
    environment: *node-env
    depends_on:
      selenium-hub:
        condition: service_started
    ports:
      - "7902:7900"
    networks: [artra-net]

  # ------------------------------------------------------------- test runner --

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: artra-e2e/runner:local
    container_name: artra-e2e-runner
    stdin_open: true
    tty: true
    environment:
      SELENIUM_HUB_URL: http://selenium-hub:4444/wd/hub
      TEST_BASE_URL: ${APP_URL:-https://artra.test}
      MAILPIT_URL: http://mailpit:8025
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-artra}
      DATABASE_USER: ${POSTGRES_USER:-artra}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-student@artra.test}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      BROWSERS: ${BROWSERS:-chrome}
      HEADED: ${HEADED:-}
      PARALLELISM: ${PARALLELISM:-2}
    depends_on:
      caddy:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    # Kept alive so `docker compose exec runner mvn verify` can be run over and
    # over against one warm stack.
    command: ["tail", "-f", "/dev/null"]
    volumes:
      # The working tree shadows the copy baked into the image, so a test edited
      # on the host is picked up by the next `mvn verify` with no rebuild.
      - ./src:/artra-e2e/src
      - ./pom.xml:/artra-e2e/pom.xml:ro
      #
      # target/ is deliberately NOT bind-mounted. Maven runs as root in the
      # container, so a mount would leave root-owned build output in the host's
      # working tree and break the next host-side build. run.sh copies the
      # reports out with `docker compose cp` instead.
      #
      # /root/.m2 is deliberately not a volume either: an empty one mounted
      # there would shadow the dependencies the image pre-fetched and force a
      # full re-download on every fresh machine.
    networks: [artra-net]

networks:
  artra-net:
    name: artra-net
    driver: bridge

volumes:
  postgres-data:
  caddy-data:

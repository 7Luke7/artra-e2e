# The whole test environment, in one file.
#
#   test runner  ──►  Selenium Grid (standalone-docker)
#                          │  starts one container per session
#                          ▼
#                     chrome / firefox / edge  (+ a video recorder)
#                          │
#                          ▼
#                     Artra  http://172.19.0.9:3000
#                          │
#            ┌─────────────┼─────────────┐
#            ▼             ▼             ▼
#       PostgreSQL       Redis        Mailpit
#
# Everything shares one bridge network, which is what lets the browser
# containers the grid starts on demand reach the application at all.
#
#   ./run.sh                                      chrome, headless
#   ./run.sh browsers=chrome,firefox,edge         the full matrix
#   ./run.sh browsers=chrome record=chrome        record the session to video
#   ./dev.sh browsers=chrome record=chrome        leave the stack up

name: artra-e2e

services:

  # ---------------------------------------------------------------- data --

  postgres:
    image: postgres:18-alpine
    container_name: artra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run ./scripts/prepare-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-artra}
    volumes:
      # Postgres runs everything in here once, in name order, the first time the
      # data directory is empty: schema, then the fixture catalogue.
      - ./stack/db/init:/docker-entrypoint-initdb.d:ro
      # /var/lib/postgresql, not .../data. From 18 the official image stores the
      # cluster in a major-version subdirectory so pg_upgrade can work across a
      # mount boundary, and it refuses to start if it finds a volume at the old
      # path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 matters. While it runs the init scripts, the official image
      # starts a temporary server bound to the unix socket only - so a bare
      # pg_isready reports ready before the schema and fixtures exist, and the
      # app and the seed job both start against an empty database. Going over
      # TCP means this only passes once initialisation has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-artra} -d ${POSTGRES_DB:-artra}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [artra-net]

  redis:
    image: redis:8-alpine
    container_name: artra-redis
    # No password: this instance holds nothing but throwaway sessions and
    # pending verifications, is not published to the host, and is reachable only
    # from inside this network.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [artra-net]

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: artra-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    ports:
      # The web UI, so a failing email test can be inspected by eye at
      # http://localhost:8025. The suite uses the same port's REST API.
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [artra-net]

  # --------------------------------------------------- application under test --

  artra:
    build:
      # Staged by scripts/prepare-app.sh from a local checkout or a fresh clone.
      context: ./.artra-build
      dockerfile: Dockerfile
      target: runtime
      args:
        # Inlined into the client bundle at build time - see the Dockerfile -
        # so the address the browsers use has to be known here, and has to be
        # the same one APP_URL carries at run time.
        VITE_URL: ${APP_URL:-http://172.19.0.9:3000}
        VITE_WS_URL: ${APP_WS_URL:-ws://172.19.0.9:3000/ws}
        VITE_EMAIL: ${EMAIL_REPLY_TO:-support@artra.test}
    image: artra-e2e/app:local
    container_name: artra-app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-artra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artra}
      REDIS_URL: redis://redis:6379
      VITE_URL: ${APP_URL:-http://172.19.0.9:3000}
      # Mail goes to the disposable server, never to a real provider. This is
      # the one switch that separates the test environment from production.
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-Artra <no-reply@artra.test>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@artra.test}
      # Application secrets. Generated per machine by scripts/prepare-env.sh and
      # never committed; they key hashes and HMACs, nothing external.
      ARGON_SECRET: ${ARGON_SECRET:?run ./scripts/prepare-env.sh}
      CODE_PEPPER: ${CODE_PEPPER:?run ./scripts/prepare-env.sh}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:?run ./scripts/prepare-env.sh}
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:?run ./scripts/prepare-env.sh}
      IP_SECRET: ${IP_SECRET:?run ./scripts/prepare-env.sh}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      artra-net:
        # A fixed address, because it is baked into the client bundle at build
        # time and named in the browsers' trusted-origin settings. A dynamically
        # assigned one would change whenever the compose project is recreated
        # and quietly point the whole suite at nothing.
        ipv4_address: 172.19.0.9
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  # One-shot: gives the seeded accounts a password, using the application's own
  # Argon2 parameters. Runs on every `up` and is idempotent, so rotating
  # SEED_USER_PASSWORD needs no database rebuild.
  seed:
    build:
      context: ./.artra-build
      dockerfile: Dockerfile
      target: seed
    image: artra-e2e/seed:local
    container_name: artra-seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-artra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artra}
      ARGON_SECRET: ${ARGON_SECRET}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?run ./scripts/prepare-env.sh}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3
    networks: [artra-net]

  # ------------------------------------------------------------ selenium grid --

  # The Dynamic Grid. It runs no browser itself: for each session it starts a
  # container from the images in config.generated.toml, attaches it to this
  # network, and removes it when the session ends. A session that asks for video
  # gets a recorder sidecar alongside it.
  #
  # This is why the stack cannot collapse into fewer containers: the grid needs
  # the Docker socket to create those containers.
  standalone-docker:
    image: selenium/standalone-docker:4.43.0
    container_name: selenium-hub
    volumes:
      # Recordings land here, one directory per session. The startup scripts
      # chown this to 1200:1201 first - the recorder writes as that uid, and
      # without it recording silently produces no files.
      - ./videos:/opt/selenium/assets
      # Generated from config.toml with max-sessions patched to PARALLELISM and
      # only the requested browsers listed.
      - ./config.generated.toml:/opt/selenium/docker.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SE_VIDEO_FILE_NAME=auto        # name the file from the session's se:name
      - SE_VIDEO_FILE_NAME_SUFFIX=false
    ports:
      # The Grid console: live sessions, the queue, and the containers in flight.
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bin/check-grid.sh --host localhost --port 4444"]
      interval: 10s
      timeout: 30s
      retries: 30
    networks: [artra-net]

  # ------------------------------------------------------------- test runner --

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: artra-e2e/runner:local
    container_name: artra-e2e-runner
    stdin_open: true
    tty: true
    environment:
      SELENIUM_HUB_URL: http://selenium-hub:4444/wd/hub
      TEST_BASE_URL: ${APP_URL:-http://172.19.0.9:3000}
      MAILPIT_URL: http://mailpit:8025
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-artra}
      DATABASE_USER: ${POSTGRES_USER:-artra}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-student@artra.test}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      BROWSERS: ${BROWSERS:-chrome}
      RECORD_VIDEO: ${RECORD_VIDEO:-}
      PARALLELISM: ${PARALLELISM:-2}
    depends_on:
      artra:
        condition: service_healthy
      standalone-docker:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    # Kept alive so `docker compose exec runner mvn verify` can be run over and
    # over against one warm stack.
    command: ["tail", "-f", "/dev/null"]
    volumes:
      # The working tree shadows the copy baked into the image, so a test edited
      # on the host is picked up by the next `mvn verify` with no rebuild.
      - ./src:/artra-e2e/src
      - ./pom.xml:/artra-e2e/pom.xml:ro
      #
      # target/ is deliberately NOT bind-mounted. Maven runs as root in the
      # container, so a mount would leave root-owned build output in the host's
      # working tree and break the next host-side build. run.sh copies the
      # reports out with `docker compose cp` instead.
    networks: [artra-net]

networks:
  artra-net:
    name: artra-net
    driver: bridge
    ipam:
      config:
        # Pinned so the application's address is a constant. The browsers the
        # grid starts join this same network, which is how they reach it.
        - subnet: 172.19.0.0/16

volumes:
  postgres-data:

# Parallel execution.
#
# Every @CrossBrowserTest invocation and every test class runs concurrently,
# capped by GridParallelismStrategy, which reads the PARALLELISM value the
# startup scripts compute from the machine's cores/RAM and write into
# env/artra-e2e.env. That single number is also the grid's max-sessions, so
# the client can never ask for more sessions than the grid can serve.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=custom
junit.jupiter.execution.parallel.config.custom.class=com.artra.e2e.base.GridParallelismStrategy

# Show the browser in the report's display name for every invocation.
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$Standard

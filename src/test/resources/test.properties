# Non-secret defaults, checked in and baked into the runner image.
#
# Every key here can be overridden by an environment variable of the same name -
# that is what docker-compose.yml and the CI workflow do. Anything sensitive
# (the database password, the fixture password) is deliberately absent: it has
# no default at all, so an unset one fails with a message naming the variable
# rather than reaching a form as an empty string.

SELENIUM_HUB_URL=http://selenium-hub:4444/wd/hub
TEST_BASE_URL=http://172.19.0.9:3000
MAILPIT_URL=http://mailpit:8025

# Implicit waits are 0 on purpose: mixed with explicit waits they make every
# findElements() that is meant to come back empty block for the full implicit
# timeout instead.
IMPLICIT_WAIT_SECONDS=0
PAGE_LOAD_TIMEOUT_SECONDS=60
EXPLICIT_WAIT_SECONDS=30

# Email is slower than a page load: the app hashes with Argon2id, writes to
# Redis and hands the message to SMTP before it answers.
MAIL_WAIT_SECONDS=45

DIAGNOSTICS_DIR=target/diagnostics
